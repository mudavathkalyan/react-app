version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install

  build:
    commands:
      - npm run build
      - ls -la dist

  post_build:
    commands:
      - echo "Deploying to S3..."
      - aws s3 sync dist/ s3://kalyan.codrbit.space --delete

artifacts:
  files:
    - '**/*'
  base-directory: dist